<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1428" />
    <title>DICE TACTICS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <main class="stage" id="stage">
        <!-- 両陣営の状態とラウンド -->
        <header class="status" aria-label="対局の状態">
          <div class="side-stat m" id="stat-m"></div>
          <div class="round-box">
            <div class="game-title">DICE TACTICS</div>
            <div id="round" class="round"></div>
            <div id="turn" class="turn"></div>
          </div>
          <div class="side-stat h" id="stat-h"></div>
        </header>

        <!-- 盤面 -->
        <div class="frame" id="frame">
          <div class="frame-band">
            <div class="frame-inner">
              <div class="coords cols" aria-hidden="true"></div>
              <div class="coords rows" aria-hidden="true"></div>
              <div class="board" id="board" role="grid" aria-label="10×10 の盤面">
                <div class="cells" id="cells"></div>
                <svg class="overlay" id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
                <div class="pieces" id="pieces" aria-hidden="true"></div>
                <div class="fx" id="fx" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        </div>
      </main>

      <!-- 選択中の駒・行動案・短い通知 -->
      <section class="info" id="info" aria-live="polite">
        <div class="info-text">
          <div id="info-main" class="info-main"></div>
          <div id="info-sub" class="info-sub"></div>
        </div>
        <button id="btn-confirm" class="btn confirm" hidden>確定</button>
      </section>

      <!-- ダイス・AP・ターン操作 -->
      <section class="tray" id="tray" aria-label="ダイスと AP">
        <div class="tray-top">
          <div class="dice-wrap">
            <div id="dice-owner" class="dice-owner"></div>
            <div id="dice" class="dice"></div>
          </div>
          <div class="ap-box">
            <div class="ap-head"><span class="ap-label">AP</span><span id="ap-num" class="ap-num"></span><span id="ap-of" class="ap-of"></span></div>
            <div id="ap-chips" class="ap-chips" aria-hidden="true"></div>
            <div id="ap-formula" class="ap-formula"></div>
          </div>
        </div>
        <div class="tray-buttons">
          <button id="btn-undo" class="btn ghost undo" aria-keyshortcuts="Z">戻す</button>
          <button id="btn-main" class="btn primary main"></button>
        </div>
      </section>

      <!-- 補助情報 -->
      <nav class="aux" aria-label="補助メニュー">
        <button class="aux-btn" data-sheet="log"><span class="aux-ico">≡</span>履歴</button>
        <button class="aux-btn" id="btn-threat" aria-pressed="false"><span class="aux-ico">◎</span>敵の射程</button>
        <button class="aux-btn" data-sheet="rules"><span class="aux-ico">?</span>ルール</button>
        <button class="aux-btn" data-sheet="settings"><span class="aux-ico">⚙</span>設定</button>
      </nav>
    </div>

    <!-- 下から開くシート -->
    <div class="sheet-back" id="sheet-back" hidden></div>
    <section class="sheet" id="sheet-log" role="dialog" aria-label="行動履歴" hidden>
      <div class="sheet-head"><h2>行動履歴</h2><button class="btn ghost sheet-close">閉じる</button></div>
      <ol id="log" class="log"></ol>
    </section>

    <section class="sheet" id="sheet-rules" role="dialog" aria-label="ルール" hidden>
      <div class="sheet-head"><h2>ルール</h2><button class="btn ghost sheet-close">閉じる</button></div>
      <div class="sheet-body rules" id="rules-body"></div>
    </section>

    <section class="sheet" id="sheet-settings" role="dialog" aria-label="設定" hidden>
      <div class="sheet-head"><h2>設定</h2><button class="btn ghost sheet-close">閉じる</button></div>
      <div class="sheet-body settings">
        <label class="row">
          <span>先手</span>
          <select id="set-first">
            <option value="human">あなた</option>
            <option value="cpu">CPU</option>
            <option value="random">ランダム</option>
          </select>
        </label>
        <div class="row">
          <span>CPU の再生速度</span>
          <div class="seg" id="set-speed" role="radiogroup" aria-label="CPU の再生速度">
            <button data-v="slow" role="radio">ゆっくり</button>
            <button data-v="normal" role="radio">標準</button>
            <button data-v="fast" role="radio">速い</button>
          </div>
        </div>
        <label class="row check">
          <input type="checkbox" id="set-quick" />
          <span>移動は 1 タップで確定する（攻撃は常にプレビューしてから確定）</span>
        </label>
        <label class="row check">
          <input type="checkbox" id="set-calm" />
          <span>演出を控えめにする</span>
        </label>
        <button id="btn-new" class="btn primary wide">新しいゲーム</button>
        <p class="note">キー操作: Space = ダイスを振る / Enter = 確定 / E = ターン終了 / Z = 移動を戻す / 1〜6 = 自軍の駒を選ぶ / Esc = 取り消し</p>
      </div>
    </section>

    <!-- 結果 -->
    <div id="result" class="result" hidden>
      <div class="result-box" role="dialog" aria-labelledby="result-title">
        <div class="result-orn" id="result-orn"></div>
        <div id="result-title" class="result-title"></div>
        <div id="result-sub" class="result-sub"></div>
        <div class="result-buttons">
          <button id="btn-again" class="btn primary">もう一度</button>
          <button id="btn-close" class="btn ghost">盤面を見る</button>
        </div>
      </div>
    </div>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
